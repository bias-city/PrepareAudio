<!doctype html>
<html lang="de">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="hilfe-body">

    <nav class="hilfe-nav" id="hilfe-nav" aria-label="Kapitel"></nav>
    <article class="hilfe-inhalt" id="hilfe-inhalt"></article>
  </main>
  <script src="i18n.js"></script>
  <script src="i18n/hilfe.js"></script>
  <script src="hilfe/de.js"></script>
  <script src="hilfe/en.js"></script>

</html>
