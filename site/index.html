<style>
/* Recursive Variable Font — SIL OFL 1.1, Lizenztext in fonts/OFL.txt.
   Lokal eingebunden: die Seite lädt NICHTS von fremden Servern. */
@font-face{
  font-family:"Recursive";
  src:url("fonts/Recursive_VF.woff2") format("woff2");
  font-weight:300 1000;
  font-display:swap;
}
:root{
  --paper:#fff;--ink:#000;--ink-2:#000;--line:#e2e2e6;--rule:#9c9ca3;--wash:#f3f3f5;
  /* Der Ton kommt aus dem App-Zeichen (Verlauf #4f0070 → #ff5300), in
     Stufen: 600 trägt Knöpfe und Links, 700 den Zeigezustand, 300 die
     Links auf dunklem Grund. Dieselbe Aubergine wie in der App. */
  --aub-700:#43065f;--aub-600:#56107a;--aub-500:#4f0070;--aub-300:#d3a6ea;--aub-050:#f3eaf6;
  --aub:var(--aub-600);--aub-2:var(--aub-700);
  --w:72rem;
  --dunkel:#1b1b1f;--dunkel-2:#121215;--dunkel-line:#3b3b42;--dunkel-rule:#6d6d75;--dunkel-ink:#fff;--dunkel-ink-2:#fff;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (max-width:640px){html{font-size:16px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Recursive",system-ui,-apple-system,sans-serif;font-variation-settings:'CASL' 0,'MONO' 0;line-height:1.5}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--aub);text-underline-offset:.18em;text-decoration-thickness:1.5px}
a:hover{text-decoration-thickness:2.5px}
:focus-visible{outline:2px solid var(--aub);outline-offset:3px}
img{max-width:100%;height:auto;display:block}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.15}
h1{font-size:clamp(2rem,4.6vw,3.4rem);font-weight:640}
h2{font-size:clamp(1.45rem,3vw,2rem)}
h3{font-size:1.15rem}
p{margin:0}
ul,ol{margin:0;padding-left:1.15rem}
li{margin:.35rem 0}
.small{font-size:.86rem;color:var(--ink-2)}
.wrap{max-width:var(--w);margin:0 auto;padding:0 1.25rem}

/* Raster wie bei LocalTranscript: Label 17 rem, Inhalt mindestens
   30 rem; ohne Platz fällt der Inhalt unter das Label. */
body{font-size:clamp(1rem,.85rem + .35vw,1.15rem)}
section{padding:4.5rem 0}
@media (max-width:640px){section{padding:3rem 0}}
main>section:nth-child(even){background:var(--wash)}
main>section.dpo{background:var(--dunkel)}
.row{display:flex;flex-wrap:wrap;gap:.9rem 3rem;align-items:flex-start}
.row>:first-child{flex:0 0 min(100%,17rem)}
.row>:last-child{flex:1 1 30rem;min-width:0}
.row.kopf{display:block;margin-bottom:2.5rem}
.row.kopf .t{margin-top:.9rem}
.row.schritt>:first-child{flex:1 1 26rem}
.row.schritt>:last-child{flex:1 1 30rem}
.row+.row{margin-top:1.6rem}
.row.gross+.row.gross{margin-top:2.25rem;padding-top:2.25rem;border-top:1px solid var(--rule)}
.row.kopf+.row.gross{border-top:0;padding-top:0;margin-top:0}
.row .t h3{margin-bottom:.35rem}
.row .t h3:has(.nr){display:flex;align-items:center}
.row .t p+p,.row .t ul,.row .t ol,.row .t ul+p{margin-top:.6rem}
.row .t li b,.row .t p b{font-weight:560}
.row>:first-child h3{font-size:1.05rem}
.row code{display:inline-block;margin-bottom:.4rem}
.row h3 .nr{display:inline-flex;align-items:center;justify-content:center;width:2.1rem;height:2.1rem;margin-right:.65rem;border-radius:50%;background:var(--aub);font-variation-settings:'MONO' 1;font-size:.95rem;font-weight:560;color:#fff;flex:none}
.keys{list-style:none;padding:0}
.keys li{display:flex;gap:.75rem;align-items:baseline}
.keys kbd{flex:0 0 5.2rem;font:inherit;font-variation-settings:'MONO' 1;font-size:.9rem;font-weight:560}
.lede{font-size:clamp(1.15rem,1rem + .5vw,1.4rem);line-height:1.4;color:var(--ink-2)}
.zitat{margin:0 0 3rem;padding:0}
.zitat p{font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.15;letter-spacing:-.01em;font-weight:640;color:var(--ink)}
.zitat p::before{content:"«";margin-right:.05em}
.zitat p::after{content:"»";margin-left:.05em}
.zitat footer{margin-top:1.1rem;padding:0;background:none;font-size:1rem;color:var(--ink-2)}

header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:3.5rem}
.brand{font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:700;letter-spacing:.01em;color:#000;text-decoration:none;font-size:1.2rem}
.right{display:flex;align-items:center;gap:1.25rem}
.right a.nav{font-size:.92rem;color:#000;text-decoration:none}
.right a.nav:hover{text-decoration:underline;text-decoration-color:var(--aub)}
@media (max-width:860px){.right a.nav{display:none}}
.langs{display:flex;gap:.15rem}
.langs button{font:inherit;font-size:.9rem;background:none;border:1px solid transparent;border-radius:.35rem;padding:.25rem .5rem;color:#000;cursor:pointer;font-variation-settings:'MONO' 1}
.langs button[aria-pressed="true"]{border-color:var(--line);background:var(--wash)}

.hero{padding-top:3.5rem}
.hero h1{margin-bottom:2rem}
h1 .initial{width:.92em;height:.92em;display:inline-block;vertical-align:-.1em;margin-right:.22em}
.hero .row{align-items:flex-end}
.hero .row>:first-child{flex:1 1 30rem}
.hero .row>:last-child{flex:0 1 auto}
.cta{display:flex;flex-wrap:wrap;gap:.75rem 1rem}
.hero .small{margin-top:.9rem}
.window{margin-top:3rem;border:1px solid var(--line);border-radius:.7rem;overflow:hidden;background:var(--wash);box-shadow:0 1px 2px rgba(31,31,38,.05),0 8px 20px rgba(31,31,38,.08),0 32px 64px -16px rgba(31,31,38,.22)}
.window .chrome{height:1.7rem;background:#ececef;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.4rem;padding-left:.75rem}
.window .chrome i{width:.7rem;height:.7rem;border-radius:50%;background:#d7d7dc;display:block}
.window img{width:100%;aspect-ratio:16/10}

.btn{display:inline-block;background:var(--aub);color:#fff;text-decoration:none;padding:.7rem 1.1rem;border-radius:.45rem;font-weight:560}
.btn:hover{background:var(--aub-2);color:#fff}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}

.shot{border:1px solid var(--line);border-radius:.5rem;overflow:hidden;background:var(--wash);box-shadow:0 1px 2px rgba(31,31,38,.05),0 6px 16px rgba(31,31,38,.08),0 24px 48px -12px rgba(31,31,38,.2)}
.shot img{width:100%}
.shot+.shot{margin-top:1rem}

code{font-variation-settings:'MONO' 1;font-size:.9rem;background:var(--paper);border:1px solid var(--line);border-radius:.3rem;padding:.15rem .45rem}

.dpo{background:var(--dunkel);color:var(--dunkel-ink)}
.dpo h2,.dpo h3{color:#fff}
.dpo a{color:#fff;text-decoration-color:var(--aub-300)}
.dpo .lede,.dpo .row .t p,.dpo .row .t li,.dpo .small{color:var(--dunkel-ink-2)}
.dpo .row.gross+.row.gross{border-top-color:var(--dunkel-rule)}

body>footer{padding:2.5rem 0 3rem;font-size:.88rem;color:var(--ink-2);background:var(--wash)}
footer .row>:first-child{flex:1 1 24rem}
footer .row>:last-child{flex:1 1 20rem}
footer address{font-style:normal}
footer .links{display:flex;flex-wrap:wrap;gap:.35rem .5rem}
</style>

en:{
  navGuide:"Guide", navDpo:"Privacy",
  h1:"Prepare multi-mic field recordings and split audio files for transcription and podcast.",
  lede:"Audio recorders cut long recordings into pieces, phones and cameras deliver formats of their own, and several microphones never run quite alike. PrepareAudio pulls the sound out of all of it, merges chunks losslessly, lays any number of recordings on top of each other in sync and masters the result to MP3 or WAV. All on your Mac: no account, no cloud, no ffmpeg to install.",
  cta:"Download for macOS", ctaGuide:"Read the guide",
  req:"For Macs with Apple Silicon, macOS 12 or later · 10 MB · signed and notarised · German, English, French, Italian · free and open source, AGPL-3.0",
  altHero:"PrepareAudio timeline: one lane per transmitter, shared sections in full colour, separate ones lighter",
  altMerge:"Merge tab with the recordings found and their chunks",
  altSync:"Analysis with track pairs, offset, drift and hit rate",
  altEdit:"Timeline with the menu open on a segment: where it goes to and its position in the stereo mixdown",

  guideH:"User guide",
  guideLede:"Three tabs, three steps: merge, synchronise, master. Each takes the result of the one before and also works on its own.",
  g1h:"Put everything in and merge",
  g1a:"Drag folders or files into the window or use “Choose folder…”, several folders at once as well. Merging takes WAV in mono, stereo and multichannel, plus MP3, M4A/AAC, FLAC, ALAC, AIFF, CAF, OGG Vorbis and the sound from MP4 and MOV videos. The app searches every subfolder, however it is sorted, and recognises the chunks of a recording by their recording time: from the file’s metadata (Broadcast WAV), from the file name or from the file date.",
  g1b:"A following chunk has the same format and starts where the previous full chunk ends; sample-exact when the metadata carry a time reference. If two chunks fit equally well, for instance with two transmitters, the audio at the seam decides: a linear predictor only forecasts the other side at the genuine join.",
  g1c:"“Merge…” asks where to save and creates the folder tracks there. Output is always WAV: copied bit for bit from WAV sources, as RF64 from 4 GB. Originals stay untouched, existing files are never overwritten.",
  g2h:"Synchronise audio sources",
  g2a:"Drop the tracks folder into the second tab, or any recordings straight away. Anything that is not WAV is decoded once so preview and timeline run smoothly; the results are WAV. The app looks for shared events with a fixed time offset: syllables, chairs scraping, dishes. Similar sound does not help, because with two lavalier mics the loudest voice is often opposite.",
  g2b:"For each pair it measures offset, clock drift and spread and checks in time windows whether the events agree; from about a minute of overlap that is enough. More than two microphones work too: where several record the same scene, a shared file is created with one channel per transmitter. They are only split when different conversations run at the same time.",
  g3h:"Edit in the timeline",
  g3a:"The analysis proposal appears as a timeline: one lane per transmitter in a colour of its own. Full colour means the segment goes into the shared file; lighter means it becomes a mono file of its own. Cut-away parts are hatched, the shared events run underneath. Time in which nobody was recording drops out: a dashed line names the length of the gap.",
  g3b:"A click on a segment opens its options: shared file or mono file of its own, plus the position in the later stereo mixdown — left, middle or right. On top of that, trimming and extending at the edges, splitting, joining, deleting and restoring. Moving in time is not possible: the measured position of each track stays fixed, all transmitters stay in sync.",
  k1:"play and pause, previewed through the speaker",
  k2:"split at the playhead",
  k3:"join with the next clip",
  k4:"delete or restore",
  k5:"put into the shared file or write as a mono file of its own",
  k6:"undo and redo",
  g3c:"Every change recalculates the output list at once. The edit is kept as a small file next to the sources and is back the next time you open them.",
  g4h:"Saving",
  g4a:"“Create…” asks for a location and writes the folder sync: one shared file per conversation — left and right with two transmitters, a polyphonic WAV with timecode and track names with more — plus mono files for everything that ran alone. While the app computes, a wheel turns, and the percentage counts only finished work.",
  g4b:"Afterwards the list clears and reports “x of x done”. Anything that failed stays, with a retry button. All three tabs work this way.",
  g5h:"Master to MP3 or WAV",
  g5a:"The third tab takes WAV, including RF64 and 32-bit float, plus MP3, M4A, FLAC, ALAC, AIFF, CAF and OGG. It shows format, bit depth, sample rate and channels, measures loudness to EBU R128 and offers two profiles and two output formats.",
  m1:"For transcription (default): fixed gain to −16 LUFS, no intervention in the dynamics",
  m2:"For listening: additionally evens out the levels of the speakers and turns down bleed",
  m3:"both: limiter at −1.5 dBTP, multichannel files mixed down to stereo by L/M/R",
  m4:"output either as MP3 at 192 kbit/s (measured again and re-encoded if it is off) or lossless as 24-bit WAV in the sample rate of the source",
  g5b:"The result lands in the folder master. For transcription the default profile is the better choice: tested on real interviews, speech recognition and speaker separation work better without levelling.",
  g6h:"Handbook, language and licences",
  g6a:"The “Help” pill at the bottom left opens the handbook: nine chapters with search and images, in all four languages. Version, publisher, links to bias.city and the source code, and every bundled component with its licence text sit in the menu under “About PrepareAudio”; that is also where you pick the language. Nothing needs to be installed: Symphonia reads the formats, ebur128 measures, LAME sits in the app bundle as a replaceable library, cpal plays the preview.",
  licH:"Why free",
  licLede:"We built the app for our own recordings. It is worth most when many people can use it.",
  l1h:"AGPL-3.0", l1p:"Anyone who modifies and distributes the app must publish their source too. That protects you from a closed variant appearing under the same name.",
  l2h:"No Pro tier", l2p:"Merging, synchronising, timeline and mastering. Nothing to unlock and nothing that becomes paid later.",
  l3h:"What costs money", l3p:"Support, institutional rollouts and adaptations to particular workflows. That funds development, not the download.",
  proofsH:"What you can check yourself",
  p4a:"Develop it further and compile it yourself.", p4b:"The repository holds the complete build chain up to the signed app. If you don't trust the binary, compile it.",
  dpoH:"Privacy",
  dpoLede:"PrepareAudio processes recorded conversations. So everything stays on your computer: the app opens no network connection of its own, not for telemetry, updates or crash reports.",
  flowT:"Data flow",
  d1:"<b>Input:</b> audio and video files from the local file system, read only.",

  d4:"<b>Preview:</b> through the default output device. Nothing is recorded.",

  guideH:"Mode d'emploi",
  guideLede:"Trois onglets, trois étapes : assembler, synchroniser, masteriser. Chacune reprend le résultat de la précédente et s'utilise aussi seule.",
  g1h:"Tout déposer et assembler",
  g1a:"Glisse des dossiers ou des fichiers dans la fenêtre, ou « Choisir un dossier… », plusieurs dossiers à la fois si tu veux. L’assemblage accepte le WAV en mono, en stéréo et en multicanal, ainsi que MP3, M4A/AAC, FLAC, ALAC, AIFF, CAF, OGG Vorbis et le son des vidéos MP4 et MOV. L’application parcourt tous les sous-dossiers, quel que soit leur rangement, et reconnaît les fragments d’un enregistrement à leur heure d’enregistrement : d’après les métadonnées du fichier (Broadcast WAV), le nom du fichier ou la date du fichier.",
  g1b:"Un fragment suivant a le même format et commence là où finit le fragment complet précédent ; à l'échantillon près quand les métadonnées portent une référence temporelle. Si deux fragments conviennent aussi bien, par exemple avec deux émetteurs, l'audio à la jointure décide : un prédicteur linéaire ne prévoit l'autre côté qu'à la vraie jointure.",
  g1c:"« Assembler… » demande où enregistrer et y crée le dossier tracks. La sortie est toujours en WAV : copiée au bit près depuis des sources WAV, en RF64 à partir de 4 Go. Les originaux restent intacts, aucun fichier existant n’est écrasé.",
  g2h:"Synchroniser les sources audio",
  g2a:"Dépose le dossier tracks dans le deuxième onglet, ou directement n’importe quels enregistrements. Tout ce qui n’est pas du WAV est décodé une fois pour que l’aperçu et la timeline restent fluides ; les résultats sont en WAV. L’application cherche des événements communs avec un décalage fixe : syllabes, chaises qui raclent, vaisselle. La ressemblance sonore n’aide pas, car avec deux micros-cravate la voix la plus forte est souvent opposée.",
  g2b:"Pour chaque paire, elle mesure décalage, dérive d’horloge et dispersion, et vérifie par fenêtres de temps si les événements concordent ; à partir d’une minute de chevauchement, cela suffit. Plus de deux micros fonctionnent aussi : là où plusieurs enregistrent la même scène naît un fichier commun avec un canal par émetteur. La séparation n’a lieu que si des conversations différentes se déroulent en même temps.",
  g3h:"Modifier dans la timeline",
  g3a:"La proposition de l’analyse apparaît en timeline : une voie par émetteur, chacune dans sa couleur. Couleur pleine veut dire que le segment ira dans le fichier commun ; plus clair veut dire qu’il deviendra un fichier mono à part. Les parties coupées sont hachurées, les événements communs courent en dessous. Le temps pendant lequel personne n’enregistrait est retiré : une ligne pointillée en indique la durée.",
  g3b:"Un clic sur un segment ouvre ses options : fichier commun ou fichier mono à part, et la position dans le mixage stéréo ultérieur — gauche, milieu ou droite. Et aussi rogner et prolonger aux bords, couper, joindre, supprimer et rétablir. Déplacer dans le temps est impossible : la position mesurée de chaque piste reste fixe, tous les émetteurs restent synchrones.",
  k1:"lire et mettre en pause, avec écoute sur le haut-parleur",
  k2:"couper à la tête de lecture",
  k3:"joindre au clip suivant",
  k4:"supprimer ou rétablir",
  k5:"mettre dans le fichier commun ou écrire comme fichier mono à part",
  k6:"annuler et rétablir",
  g3c:"Chaque modification recalcule aussitôt la liste de sortie. La modification est gardée dans un petit fichier à côté des sources et revient à la prochaine ouverture.",
  g4h:"Enregistrer",
  g4a:"« Créer… » demande un emplacement et écrit le dossier sync : par conversation un fichier commun — à deux émetteurs, à gauche et à droite ; à plusieurs, un WAV polyphonique avec timecode et noms de pistes — plus des fichiers mono pour tout ce qui tournait seul. Pendant le calcul, une roue tourne, et le pourcentage ne compte que le travail terminé.",
  g4b:"Ensuite la liste se vide et indique « x sur x terminés ». Ce qui a échoué reste, avec un bouton pour réessayer. Les trois onglets fonctionnent ainsi.",
  g5h:"Masteriser en MP3 ou en WAV",
  g5a:"Le troisième onglet accepte le WAV, y compris RF64 et 32 bits flottants, ainsi que MP3, M4A, FLAC, ALAC, AIFF, CAF et OGG. Il affiche format, profondeur, fréquence et canaux, mesure la loudness selon EBU R128 et propose deux profils et deux formats de sortie.",
  m1:"Pour la transcription (par défaut) : gain fixe à −16 LUFS, aucune intervention sur la dynamique",
  m2:"Pour l’écoute : égalise en plus le niveau des personnes qui parlent et atténue la diaphonie",
  m3:"les deux : limiteur à −1,5 dBTP, fichiers multicanaux mixés en stéréo selon L/M/R",
  m4:"sortie au choix en MP3 à 192 kbit/s (remesuré et réencodé en cas d’écart) ou en WAV 24 bits sans perte, à la fréquence d’échantillonnage de la source",
  g5b:"Le résultat se trouve dans le dossier master. Pour la transcription, le profil par défaut est le meilleur choix : vérifié sur de vrais entretiens, la reconnaissance vocale et la séparation des locuteurs fonctionnent mieux sans régulation.",
  g6h:"Manuel, langue et licences",
  g6a:"La pastille « Aide » en bas à gauche ouvre le manuel : neuf chapitres avec recherche et images, dans les quatre langues. Version, éditeur, liens vers bias.city et le code source et tous les composants livrés avec leurs textes de licence figurent dans le menu sous « About PrepareAudio » ; c’est aussi là que tu choisis la langue. Rien n’est à installer : Symphonia lit les formats, ebur128 mesure, LAME est une bibliothèque remplaçable dans le paquet de l’app, cpal joue l’aperçu.",
  licH:"Pourquoi gratuit",
  licLede:"Nous avons construit l'application pour nos propres enregistrements. Elle a le plus de valeur quand beaucoup peuvent l'utiliser.",
  l1h:"AGPL-3.0", l1p:"Qui modifie et redistribue l'application doit publier son code aussi. Cela vous protège d'une variante fermée sous le même nom.",
  l2h:"Pas de niveau Pro", l2p:"Assemblage, synchronisation, timeline et mastering. Rien à débloquer, rien qui devienne payant plus tard.",
  l3h:"Ce qui coûte", l3p:"Le support, les déploiements institutionnels et les adaptations à des flux de travail précis. C'est cela qui finance le développement, pas le téléchargement.",
  proofsH:"Ce que vous pouvez vérifier vous-même",
  p4a:"Développer et compiler soi-même.", p4b:"Le dépôt contient toute la chaîne de build jusqu'à l'application signée. Qui ne fait pas confiance au binaire compile.",
  dpoH:"Protection des données",
  dpoLede:"PrepareAudio traite des enregistrements de conversations. Tout reste donc sur votre ordinateur : l'application n'ouvre elle-même aucune connexion réseau, ni pour la télémétrie, ni pour les mises à jour, ni pour les rapports de plantage.",
  flowT:"Flux de données",
  d1:"<b>Entrée :</b> fichiers audio et vidéo du système de fichiers local, en lecture seule.",
  d2:"<b>Traitement :</b> dans le processus de l'application, sur votre Mac. Pas de programme auxiliaire, pas de cloud.",
  d3:"<b>Stockage :</b> les dossiers tracks, sync et master là où vous les enregistrez ; la modification de la timeline dans un petit fichier JSON à côté des sources ; les copies décodées des MP3 et autres dans le cache de l'application (~/Library/Caches/city.bias.prepareaudio).",
  d4:"<b>Aperçu :</b> par la sortie audio par défaut. Rien n'est enregistré.",
  d5:"<b>Réseau :</b> aucune connexion. Seuls les liens du manuel et du panneau d’information ouvrent le navigateur au clic.",
  yoursH:"Ce qui reste de votre responsabilité",
  y1:"Le consentement et l'information des personnes enregistrées.",
  y2:"Le chiffrement du disque, par exemple avec FileVault.",
  y3:"Les délais de conservation des originaux, des trois dossiers de résultats et du cache ; l'application supprime les fichiers de cache inutilisés après 30 jours.",
  y4:"La destination des résultats ensuite, par exemple une transcription.",
  dpoNote:"Pas de sous-traitant, pas de transfert vers un pays tiers, rien n'est transmis. La qualification de votre propre traitement selon le RGPD ou la nLPD reste du ressort du responsable du traitement.",
  conH:"Contact",
  conL1:"Support et déploiements", conL2:"Bugs et souhaits",

it:{
  navGuide:"Guida", navDpo:"Protezione dei dati",
  h1:"Prepara field recording multi-microfono e file audio spezzati per trascrizione e podcast.",
  lede:"I registratori audio tagliano le registrazioni lunghe in pezzi, telefoni e videocamere danno formati propri, e più microfoni non vanno mai esattamente uguali. PrepareAudio estrae il suono da tutto, unisce i frammenti senza perdite, sovrappone in sincrono un numero qualsiasi di registrazioni e masterizza il risultato in MP3 o WAV. Tutto sul tuo Mac: nessun account, nessun cloud, nessun ffmpeg da installare.",
  cta:"Scarica per macOS", ctaGuide:"Leggi la guida",
  req:"Per Mac con Apple Silicon, macOS 12 o successivo · 10 MB · firmata e notarizzata · tedesco, inglese, francese, italiano · gratuita e open source, AGPL-3.0",
  altHero:"Timeline di PrepareAudio: una corsia per ogni trasmettitore, i segmenti comuni a colore pieno, quelli separati più chiari",
  altMerge:"Scheda di unione con le registrazioni trovate e i loro frammenti",
  altSync:"Analisi con coppie di tracce, sfasamento, deriva e quota di corrispondenze",
  altEdit:"Timeline con il menu aperto su un segmento: destinazione e posizione nel mixdown stereo",
  altDone:"Scheda finale «23 di 23 completati» con un pulsante per il passo successivo",
  altMaster:"Scheda di mastering con formato e loudness misurata per file",
  altInfo:"Campo Info con versione, link, scelta della lingua e tutte le licenze",
  altHandbuch:"Il manuale nell’app con capitoli, ricerca e immagini",
  guideH:"Guida all'uso",
  guideLede:"Tre schede, tre passi: unire, sincronizzare, masterizzare. Ognuno prende il risultato del precedente e funziona anche da solo.",
  g1h:"Inserire tutto e unire",
  g1a:"Trascina cartelle o file nella finestra oppure usa «Scegli cartella…», anche più cartelle insieme. Unire accetta WAV in mono, stereo e multicanale, oltre a MP3, M4A/AAC, FLAC, ALAC, AIFF, CAF, OGG Vorbis e il suono dei video MP4 e MOV. L’app cerca in tutte le sottocartelle, comunque siano ordinate, e riconosce i frammenti di una registrazione dall’ora di registrazione: dai metadati del file (Broadcast WAV), dal nome del file o dalla data del file.",
  g1b:"Un frammento successivo ha lo stesso formato e inizia dove finisce il frammento completo precedente; al campione esatto quando i metadati portano un riferimento temporale. Se due frammenti vanno ugualmente bene, per esempio con due trasmettitori, decide l'audio alla giunzione: un predittore lineare prevede l'altro lato solo alla giunzione vera.",
  g1c:"«Unisci…» chiede dove salvare e vi crea la cartella tracks. L’uscita è sempre WAV: dalle sorgenti WAV copiata bit per bit, da 4 GB in su come RF64. Gli originali restano intatti, i file esistenti non vengono mai sovrascritti.",
  g2h:"Sincronizzare le sorgenti audio",
  g2a:"Nella seconda scheda deposita la cartella tracks, oppure direttamente registrazioni qualsiasi. Tutto ciò che non è WAV viene decodificato una volta, così anteprima e timeline restano fluide; i risultati sono WAV. L’app cerca eventi comuni con uno sfasamento fisso: sillabe, sedie spostate, stoviglie. La somiglianza del suono non aiuta, perché con due microfoni lavalier la voce più forte è spesso opposta.",
  g2b:"Per ogni coppia misura sfasamento, deriva dell’orologio e dispersione e verifica in finestre temporali se gli eventi coincidono; basta un minuto di sovrapposizione. Vanno bene anche più di due microfoni: dove più trasmettitori registrano lo stesso evento nasce un file comune con un canale per trasmettitore. Vengono separati solo quando si svolgono contemporaneamente conversazioni diverse.",
  g3h:"Modificare nella timeline",
  g3a:"La proposta dell’analisi appare come timeline: una corsia per ogni trasmettitore, ciascuna con il suo colore. Il colore pieno significa che il segmento va nel file comune; il colore chiaro significa che diventa un file mono a parte. Ciò che è tagliato via è tratteggiato, sotto scorrono gli eventi comuni. Il tempo in cui nessuno registrava viene tolto: una linea tratteggiata indica la durata della lacuna.",
  g3b:"Un clic su un segmento apre le sue opzioni: File comune oppure File mono a parte, e la posizione nel mixdown stereo successivo — sinistra, centro o destra. Inoltre rifilare ed estendere ai bordi, dividere, congiungere, eliminare e ripristinare. Spostare nel tempo non è possibile: la posizione misurata di ogni traccia resta fissa, tutti i trasmettitori restano sincroni.",
  k1:"riprodurre e mettere in pausa, con anteprima dall'altoparlante",
  k2:"dividere alla testina",
  k3:"congiungere alla clip successiva",
  k4:"eliminare o ripristinare",
  k5:"mettere nel file comune o scrivere come file mono a parte",
  k6:"annullare e ripetere",
  g3c:"Ogni modifica ricalcola subito l'elenco dei file in uscita. La modifica resta in un piccolo file accanto alle sorgenti e torna alla prossima apertura.",
  g4h:"Salvare",
  g4a:"«Crea…» chiede dove salvare e scrive la cartella sync: per ogni conversazione un file comune — con due trasmettitori a sinistra e a destra, con più trasmettitori un WAV polifonico con timecode e nomi delle tracce — più file mono per tutto ciò che è andato da solo. Durante il calcolo gira una ruota, e la percentuale conta solo il lavoro concluso.",
  g4b:"Poi l'elenco si svuota e riporta «x di x completati». Ciò che non è riuscito resta, con un pulsante per riprovare. Le tre schede funzionano così.",
  g5h:"Masterizzare in MP3 o WAV",
  g5a:"La terza scheda accetta WAV, anche RF64 e 32 bit float, oltre a MP3, M4A, FLAC, ALAC, AIFF, CAF e OGG. Mostra formato, profondità di bit, frequenza di campionamento e canali, misura la loudness secondo EBU R128 e offre due profili e due formati di uscita.",
  m1:"Per la trascrizione (predefinito): guadagno fisso a −16 LUFS, nessun intervento sulla dinamica",
  m2:"Per l’ascolto: pareggia inoltre i livelli di chi parla e attenua la diafonia",
  m3:"entrambi: limiter a −1,5 dBTP, i file multicanale miscelati in stereo secondo L/M/R",
  m4:"uscita a scelta come MP3 a 192 kbit/s (rimisurato e ricodificato se si discosta) oppure senza perdite come WAV a 24 bit nella frequenza di campionamento della sorgente",
  g5b:"Il risultato si trova nella cartella master. Per la trascrizione il profilo predefinito è la scelta migliore: verificato su interviste reali, riconoscimento vocale e separazione dei parlanti funzionano meglio senza regolazione.",
  g6h:"Manuale, lingua e licenze",
  g6a:"Il pulsante «Aiuto» in basso a sinistra apre il manuale: nove capitoli con ricerca e immagini, in tutte e quattro le lingue. Versione, editore, link a bias.city e al codice sorgente e tutti i componenti inclusi con i loro testi di licenza stanno nel menu sotto «About PrepareAudio»; lì scegli anche la lingua. Non serve installare nulla: Symphonia legge i formati, ebur128 misura, LAME sta nel pacchetto dell’app come libreria sostituibile, cpal riproduce l’anteprima.",
  licH:"Perché gratuita",
  licLede:"Abbiamo costruito l'app per le nostre registrazioni. Ha il massimo valore d'uso quando in molti possono usarla.",
  l1h:"AGPL-3.0", l1p:"Chi modifica e ridistribuisce l'app deve pubblicare anche il proprio codice. Questo ti protegge da una variante chiusa con lo stesso nome.",
  l2h:"Nessun livello Pro", l2p:"Unione, sincronizzazione, timeline e mastering. Niente da sbloccare e niente che diventi a pagamento più avanti.",
  l3h:"Cosa costa", l3p:"Supporto, installazioni per istituti e adattamenti a flussi di lavoro specifici. È questo che finanzia lo sviluppo, non il download.",
  proofsH:"Cosa puoi verificare da te",
  p4a:"Svilupparla e compilarla da sé.", p4b:"Il repository contiene l'intera catena di build fino all'app firmata. Chi non si fida del binario compila.",
  dpoH:"Protezione dei dati",
  dpoLede:"PrepareAudio elabora registrazioni di conversazioni. Per questo tutto resta sul tuo computer: l'app non apre da sé alcuna connessione di rete, né per telemetria, né per aggiornamenti, né per rapporti di arresto.",
  flowT:"Flusso dei dati",
  d1:"<b>Ingresso:</b> file audio e video dal file system locale, solo in lettura.",
  d2:"<b>Elaborazione:</b> nel processo dell'app, sul tuo Mac. Nessun programma ausiliario, nessun cloud.",
  d3:"<b>Archiviazione:</b> le cartelle tracks, sync e master dove le salvi; la modifica della timeline in un piccolo file JSON accanto alle sorgenti; le copie decodificate di MP3 e simili nella cache dell'app (~/Library/Caches/city.bias.prepareaudio).",
  d4:"<b>Anteprima:</b> tramite l'uscita audio predefinita. Non viene registrato nulla.",
  d5:"<b>Rete:</b> nessuna connessione. Solo i link nel manuale e nel pannello info aprono il browser con un clic.",
  yoursH:"Cosa resta di tua responsabilità",
  y1:"Consenso e informazione delle persone registrate.",
  y2:"Cifratura del disco, per esempio con FileVault.",
  y3:"Tempi di conservazione degli originali, delle tre cartelle di risultati e della cache; l'app elimina i file di cache inutilizzati dopo 30 giorni.",
  y4:"Dove vanno poi i risultati, per esempio in una trascrizione.",
  dpoNote:"Nessun responsabile esterno, nessun trasferimento verso paesi terzi, non viene trasmesso nulla. L'inquadramento del proprio trattamento secondo il GDPR o la nLPD resta al titolare.",
  conH:"Contatto",
  conL1:"Supporto e installazioni", conL2:"Errori e richieste",
  conLede:"Domande sull'app, supporto, installazioni per istituti o adattamenti a un flusso di lavoro: scrivici su LinkedIn.",
  conBtn:"B/IAS su LinkedIn", conIssue:"Issue tracker su GitHub",
  conAlt:"Come issue nel repository GitHub, dove restano tracciabili.",
  footDev:"PrepareAudio è un'app del B/IAS, sviluppata a Basilea.",

/* Schlüssel, deren Text Auszeichnung enthält — nur diese als HTML. */
const HTML_KEYS = new Set(['d1','d2','d3','d4','d5']);

function setLang(l, inDieUrl){
  const t = T[l] || T.de;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const k = el.dataset.t;
    const v = (k in t) ? t[k] : T.de[k];
    if(v === undefined) return;
    if(HTML_KEYS.has(k)) el.innerHTML = v; else el.textContent = v;
  });
  /* Bildschirmfotos gibt es je Sprache: img/<name>-<lang>.png */
  document.querySelectorAll('img[data-img], img[data-alt]').forEach(im=>{
    if(im.dataset.img) im.src = 'img/' + im.dataset.img + '-' + l + '.png';
    const a = im.dataset.alt;
    if(a) im.alt = (a in t) ? t[a] : (T.de[a] || im.alt);
  });
  document.querySelectorAll('.langs button').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.lang===l)));
  /* Sprache in ?lang=, der Hash gehört den Abschnitten. */
  if(inDieUrl){
    try{
      const u = new URL(location.href);
      u.searchParams.set('lang', l);
      history.replaceState(null, '', u);
    }catch(e){}
  }
}

document.querySelectorAll('.langs button').forEach(b=>
  b.addEventListener('click', ()=>setLang(b.dataset.lang, true)));

const ausUrl = new URLSearchParams(location.search).get('lang');
const ausBrowser = (navigator.language || 'de').slice(0,2);
setLang(T[ausUrl] ? ausUrl : T[ausBrowser] ? ausBrowser : 'de', false);
</script>
